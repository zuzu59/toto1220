name: Bump version and tag

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Bump version
        run: npm run version:bump
      - name: Build docs
        run: npm run build
      - name: Capture version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md docs
          git commit -m "change: bump version to ${{ steps.version.outputs.version }}" -m "Automated version bump, changelog refresh, docs rebuild and release tagging."
          git push origin HEAD:${{ github.ref_name }}
      - name: Push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
