name: Bump version and tag

on:
  push:
    branches: [master]
    paths-ignore:
      - AGENT.md
      - PROMPT.md
      - PROMPT-2.md
      - kanban-a-faire.md
      - kanban-termine.md
      - README.md
      - CHANGELOG.md
      - RELEASE_NOTES.md
      - .claude/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build docs
        run: npm run build
      - name: Compute release version and notes
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const utils = await import('./scripts/changelog-utils.mjs')
          const pkg = JSON.parse(readFileSync('./package.json', 'utf8'))
          const parse = (value) => String(value || '0.0.0').replace(/^v/, '').split('.').map((part) => Number(part) || 0)
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index]
            }
            return 0
          }
          const latestTag = utils.getLatestVersionTag()
          const currentVersion = parse(pkg.version)
          const latestVersion = parse(latestTag)
          const baseVersion = compare(currentVersion, latestVersion) >= 0 ? currentVersion : latestVersion
          const nextVersion = `${baseVersion[0]}.${baseVersion[1]}.${baseVersion[2] + 1}`
          const now = new Date().toISOString().replace('T', ' ').slice(0, 16)
          const range = latestTag ? `${latestTag}..HEAD` : 'HEAD'
          const commits = utils.getCommits(range)
          const notes = utils.buildGithubReleaseNotes(nextVersion, now, commits.length ? commits : [{ subject: 'Mise à jour de maintenance.', body: '' }])
          writeFileSync('/tmp/release-notes.md', `${notes}\n`)
          writeFileSync('/tmp/release-version.txt', `${nextVersion}\n`)
          console.log(`version=${nextVersion}`)
          NODE
          VERSION=$(cat /tmp/release-version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          force_orphan: true
